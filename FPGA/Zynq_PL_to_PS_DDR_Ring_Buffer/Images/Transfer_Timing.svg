<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; }
      .row { font-size: 21px; font-weight: 700; }
      .cell { font-size: 18px; font-weight: 700; }
      .small { font-size: 16px; fill: #536277; }
    </style>
  </defs>

  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Ping-Pong 与 Ring Buffer 的角色切换时序</text>
  <text x="700" y="78" text-anchor="middle" class="small">示意关系不依赖具体启动相位；每个时间窗口为 0.5 s</text>

  <g transform="translate(230,125)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#536277" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="420" stroke="#d0d7e2"/>
    <line x1="270" y1="-10" x2="270" y2="420" stroke="#d0d7e2"/>
    <line x1="540" y1="-10" x2="540" y2="420" stroke="#d0d7e2"/>
    <line x1="810" y1="-10" x2="810" y2="420" stroke="#d0d7e2"/>
    <line x1="1080" y1="-10" x2="1080" y2="420" stroke="#d0d7e2"/>
    <text x="0" y="-20" text-anchor="middle" class="small">0</text>
    <text x="270" y="-20" text-anchor="middle" class="small">0.5 s</text>
    <text x="540" y="-20" text-anchor="middle" class="small">1.0 s</text>
    <text x="810" y="-20" text-anchor="middle" class="small">1.5 s</text>
    <text x="1080" y="-20" text-anchor="middle" class="small">2.0 s</text>

    <text x="-30" y="65" text-anchor="end" class="row">Ping</text>
    <rect x="0" y="25" width="270" height="70" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="135" y="68" text-anchor="middle" class="cell">接收 20 MB</text>
    <rect x="270" y="25" width="270" height="70" fill="#fff0e5" stroke="#ef7627" stroke-width="2"/>
    <text x="405" y="58" text-anchor="middle" class="cell">搬入 Ring</text>
    <text x="405" y="82" text-anchor="middle" class="small">槽 0 前半槽</text>
    <rect x="540" y="25" width="270" height="70" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="675" y="68" text-anchor="middle" class="cell">接收下一块 20 MB</text>
    <rect x="810" y="25" width="270" height="70" fill="#fff0e5" stroke="#ef7627" stroke-width="2"/>
    <text x="945" y="58" text-anchor="middle" class="cell">搬入 Ring</text>
    <text x="945" y="82" text-anchor="middle" class="small">槽 1 前半槽</text>

    <text x="-30" y="170" text-anchor="end" class="row">Pong</text>
    <rect x="0" y="130" width="270" height="70" fill="#f3f5f8" stroke="#aab4c3"/>
    <text x="135" y="173" text-anchor="middle" class="small">等待</text>
    <rect x="270" y="130" width="270" height="70" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="405" y="173" text-anchor="middle" class="cell">接收 20 MB</text>
    <rect x="540" y="130" width="270" height="70" fill="#fff0e5" stroke="#ef7627" stroke-width="2"/>
    <text x="675" y="163" text-anchor="middle" class="cell">搬入 Ring</text>
    <text x="675" y="187" text-anchor="middle" class="small">槽 0 后半槽</text>
    <rect x="810" y="130" width="270" height="70" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="945" y="173" text-anchor="middle" class="cell">接收下一块 20 MB</text>

    <text x="-30" y="275" text-anchor="end" class="row">Ring 槽</text>
    <rect x="0" y="235" width="270" height="70" fill="#f3f5f8" stroke="#aab4c3"/>
    <text x="135" y="278" text-anchor="middle" class="small">等待完整半秒块</text>
    <rect x="270" y="235" width="270" height="70" fill="#eaf7ed" stroke="#1f7a3a" stroke-width="2"/>
    <text x="405" y="278" text-anchor="middle" class="cell">写槽 0 前 20 MB</text>
    <rect x="540" y="235" width="270" height="70" fill="#eaf7ed" stroke="#1f7a3a" stroke-width="2"/>
    <text x="675" y="278" text-anchor="middle" class="cell">写槽 0 后 20 MB</text>
    <rect x="810" y="235" width="270" height="70" fill="#eaf7ed" stroke="#1f7a3a" stroke-width="2"/>
    <text x="945" y="278" text-anchor="middle" class="cell">写槽 1 前 20 MB</text>

    <text x="-30" y="380" text-anchor="end" class="row">写指针</text>
    <rect x="0" y="340" width="810" height="70" fill="#fff0e5" stroke="#ef7627" stroke-width="2"/>
    <text x="405" y="383" text-anchor="middle" class="cell">ring_wr_ptr 指向槽 0</text>
    <rect x="810" y="340" width="270" height="70" fill="#fff0e5" stroke="#ef7627" stroke-width="2"/>
    <text x="945" y="383" text-anchor="middle" class="cell">指向槽 1</text>
  </g>

  <rect x="230" y="575" width="1080" height="45" rx="8" fill="#f4f8fc" stroke="#2474b5"/>
  <text x="770" y="596" text-anchor="middle" class="small">单通道示意：在 1.5 s 时，槽 0 的两个半槽均已完成，PL 推进写指针后，PS 才能读取槽 0</text>
  <text x="770" y="616" text-anchor="middle" class="small">A/B 成对读取时，应等待两个通道都完成并推进各自写指针</text>
</svg>

