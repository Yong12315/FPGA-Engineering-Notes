<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2474b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef7627"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 17px; fill: #536277; }
      .section { font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">PL 数据写入 PS DDR 的完整链路</text>

  <rect x="35" y="78" width="825" height="430" rx="18" fill="#f4f8fc" stroke="#2474b5" stroke-width="2"/>
  <text x="58" y="112" class="section" fill="#2474b5">PL 数据采集与搬运</text>
  <rect x="875" y="78" width="490" height="430" rx="18" fill="#f4fbf5" stroke="#1f7a3a" stroke-width="2"/>
  <text x="898" y="112" class="section" fill="#1f7a3a">PS DDR 与软件读取</text>

  <g>
    <rect x="65" y="190" width="130" height="120" rx="10" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="130" y="232" text-anchor="middle" class="label">ADC A/B</text>
    <text x="130" y="266" text-anchor="middle" class="small">40 MB/s/通道</text>
    <text x="130" y="292" text-anchor="middle" class="small">CAN_H / CAN_L</text>

    <rect x="245" y="190" width="125" height="120" rx="10" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="307" y="240" text-anchor="middle" class="label">IOB</text>
    <text x="307" y="276" text-anchor="middle" class="small">固定采样路径</text>

    <rect x="420" y="190" width="145" height="120" rx="10" fill="#e6f1fa" stroke="#2474b5" stroke-width="2"/>
    <text x="492" y="238" text-anchor="middle" class="label">FIFO</text>
    <text x="492" y="271" text-anchor="middle" class="small">256 Bytes</text>
    <text x="492" y="296" text-anchor="middle" class="small">128 B 触发搬运</text>

    <rect x="615" y="160" width="205" height="180" rx="10" fill="#fff3e9" stroke="#ef7627" stroke-width="2"/>
    <text x="717" y="202" text-anchor="middle" class="label">DDR Ping / Pong</text>
    <rect x="642" y="224" width="65" height="74" rx="7" fill="#ffe4cf" stroke="#ef7627"/>
    <rect x="728" y="224" width="65" height="74" rx="7" fill="#ffe4cf" stroke="#ef7627"/>
    <text x="674" y="253" text-anchor="middle" class="small">Ping</text>
    <text x="674" y="280" text-anchor="middle" class="small">20 MB</text>
    <text x="760" y="253" text-anchor="middle" class="small">Pong</text>
    <text x="760" y="280" text-anchor="middle" class="small">20 MB</text>
    <text x="717" y="326" text-anchor="middle" class="small">每半秒交换角色</text>

    <rect x="905" y="160" width="225" height="180" rx="10" fill="#eaf7ed" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1017" y="202" text-anchor="middle" class="label">DDR Ring Buffer</text>
    <text x="1017" y="242" text-anchor="middle" class="small">5 个逻辑槽/通道</text>
    <text x="1017" y="273" text-anchor="middle" class="small">40 MB/槽</text>
    <text x="1017" y="304" text-anchor="middle" class="small">循环保存最近数据</text>

    <rect x="1190" y="190" width="140" height="120" rx="10" fill="#eaf7ed" stroke="#1f7a3a" stroke-width="2"/>
    <text x="1260" y="236" text-anchor="middle" class="label">PS 软件</text>
    <text x="1260" y="271" text-anchor="middle" class="small">按完整槽读取</text>
    <text x="1260" y="296" text-anchor="middle" class="small">避开当前写槽</text>
  </g>

  <line x1="195" y1="250" x2="238" y2="250" stroke="#2474b5" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="370" y1="250" x2="413" y2="250" stroke="#2474b5" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="565" y1="250" x2="608" y2="250" stroke="#2474b5" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="820" y1="250" x2="898" y2="250" stroke="#ef7627" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="1130" y1="250" x2="1183" y2="250" stroke="#1f7a3a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="570" y="145" text-anchor="middle" class="small">Ping-Pong DMA：128 B 突发写入</text>
  <text x="865" y="145" text-anchor="middle" class="small">Ring Buffer DMA：20 MB/0.5 s</text>

  <rect x="470" y="400" width="350" height="80" rx="10" fill="#ffffff" stroke="#536277" stroke-width="2"/>
  <text x="645" y="433" text-anchor="middle" class="label">FSM 与数据流控制</text>
  <text x="645" y="463" text-anchor="middle" class="small">选择 Ping/Pong、源地址、Ring 目标地址</text>
  <line x1="645" y1="400" x2="700" y2="344" stroke="#536277" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="940" y="400" width="350" height="80" rx="10" fill="#ffffff" stroke="#ef7627" stroke-width="2"/>
  <text x="1115" y="433" text-anchor="middle" class="label">ring_wr_ptr_A / ring_wr_ptr_B</text>
  <text x="1115" y="463" text-anchor="middle" class="small">指向 PL 当前正在写入的 40 MB 槽</text>
  <line x1="1030" y1="340" x2="1075" y2="394" stroke="#ef7627" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="1290" y1="400" x2="1290" y2="318" stroke="#ef7627" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <text x="700" y="560" text-anchor="middle" class="small">A、B 两个通道结构相同，分别维护独立的数据区和写指针</text>
</svg>

